services:
  redis:
    image: bitnami/redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT}:${REDIS_INNER_PORT}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - micro-proxy-net

networks:
  micro-proxy-net:
    external: true
    name: microservice-network

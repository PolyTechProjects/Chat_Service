services:
  notification_app:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: notification_app
    ports:
      - "${APP_HTTP_PORT}:${APP_HTTP_INNER_PORT}"
    environment:
      - DB_HOST=notification_db
      - DB_PORT=${DB_INNER_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_INNER_PORT}
      - AUTH_HOST=auth_app
      - AUTH_PORT=${AUTH_INNER_PORT}
      - CHAT_HOST=chat_app
      - CHAT_PORT=${CHAT_INNER_PORT}
      - APP_HTTP_PORT=${APP_HTTP_INNER_PORT}
    depends_on:
      - notification_db
    networks:
      - micro-proxy-net

  notification_db:
    image: postgres:15.3
    container_name: notification_db
    ports:
      - "${DB_PORT}:${DB_INNER_PORT}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - micro-proxy-net

networks:
  micro-proxy-net:
    external: true
    name: microservice-network

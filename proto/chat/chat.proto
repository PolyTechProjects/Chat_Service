syntax = "proto3";

package chat;

option go_package = "example.com/proto/chat";

service Chat {
    rpc GetChat (GetChatRequest) returns (ChatResponse) {}

    rpc GetDirectChat (GetDirectChatRequest) returns (DirectChatResponse) {}

    rpc VerifyUserAction (VerifyUserActionRequest) returns (VerifyUserActionResponse) {}

    rpc VerifyUserPersistance (VerifyUserPersistanceRequest) returns (VerifyUserPersistanceResponse) {}

    rpc GetChatAndUserNames (GetChatAndUserNamesRequest) returns (GetChatAndUserNamesResponse) {}

    rpc VerifyUserActionOnSomebody (VerifyUserActionOnSomebodyRequest) returns (VerifyUserActionOnSomebodyResponse) {}
}

message GetChatRequest {
    string chatId = 1;
    string userId = 2;
}

message ChatResponse {
    string chatId = 1;
    string name = 2;
    string description = 3;
    string profilePic = 4;
    bool isChannel = 5;
    bool isClosed = 6;
    string joinLink = 7;
    string creatorId = 8;
    repeated string participantsIds = 9;
}

message GetDirectChatRequest {
    string chatId = 1;
    string ownUserId = 2;
}

message DirectChatResponse {
    string chatId = 1;
    string ownUserId = 2;
    string targetUserId = 3;
}

message VerifyUserActionRequest {
    string chatId = 1;
    string userId = 2;
    string action = 3;
}

message VerifyUserActionResponse {
    bool isVerified = 1;
}

message VerifyUserPersistanceRequest {
    string chatId = 1;
    string userId = 2;
}

message VerifyUserPersistanceResponse {
    bool isVerified = 1;
}

message GetChatAndUserNamesRequest {
    string chatId = 1;
    string userId = 2;
}

message GetChatAndUserNamesResponse {
    string chatName = 1;
    string userName = 2;
}

message VerifyUserActionOnSomebodyRequest {
    string chatId = 1;
    string userId = 2;
    string targetUserId = 3;
    string action = 4;
}

message VerifyUserActionOnSomebodyResponse {
    bool isVerified = 1;
}

services:
  chat_app:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: chat_app
    ports:
      - "${APP_HTTP_PORT}:${APP_HTTP_INNER_PORT}"
      - "${APP_GRPC_PORT}:${APP_GRPC_INNER_PORT}"
    environment:
      - DB_HOST=chat_db
      - DB_PORT=${DB_INNER_PORT}
      - AUTH_HOST=auth_app
      - AUTH_PORT=${AUTH_INNER_PORT}
      - USERS_HOST=users_app
      - USERS_PORT=${USERS_INNER_PORT}
      - APP_HTTP_PORT=${APP_HTTP_INNER_PORT}
      - APP_GRPC_PORT=${APP_GRPC_INNER_PORT}
    depends_on:
      - chat_db
    networks:
      - micro-proxy-net

  chat_db:
    image: postgres:15.3
    container_name: chat_db
    ports:
      - "${DB_PORT}:${DB_INNER_PORT}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - micro-proxy-net

networks:
  micro-proxy-net:
    external: true
    name: chaotic-network